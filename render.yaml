services:
  - type: web
    name: agente-shopee
    runtime: python
    plan: starter            # o plano gratuito "dorme"; as tarefas em segundo plano precisam do serviço acordado
    buildCommand: pip install -r requirements.txt
    # 1 worker só: o andamento das tarefas fica na memória do processo
    startCommand: gunicorn app:app --workers 1 --threads 4 --timeout 120
    healthCheckPath: /health
    envVars:
      - key: DRY_RUN
        value: "1"           # simulação. Só troque para 0 quando a Shopee aprovar e você validar
      - key: APP_BASE_URL
        sync: false          # ex.: https://agente-shopee.onrender.com
      - key: ADMIN_USER
        sync: false
      - key: ADMIN_PASS
        sync: false
      - key: CRON_TOKEN
        sync: false          # senha longa e aleatória; o cron-job.org usa para chamar /pausa/iniciar e /pausa/retomar
      - key: DATABASE_URL
        sync: false          # Postgres (Render ou Neon). Sem isso o app usa SQLite, que o Render apaga a cada deploy
      - key: ML_CLIENT_ID
        sync: false
      - key: ML_CLIENT_SECRET
        sync: false
      - key: BLING_CLIENT_ID
        sync: false
      - key: BLING_CLIENT_SECRET
        sync: false
      - key: BLING_LOJA_ID
        sync: false          # ID da loja "Shopee - Store" no Bling (pode preencher depois no painel)
      - key: SHOPEE_PARTNER_ID
        sync: false          # só quando a conta for aprovada
      - key: SHOPEE_PARTNER_KEY
        sync: false
